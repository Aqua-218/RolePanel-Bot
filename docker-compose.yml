services:
  bot:
    build: .
    image: role-panel-bot:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL}
      RUST_LOG: ${RUST_LOG:-info}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      BOT_NAME: ${BOT_NAME:-Role Panel Bot}
      BOT_DESCRIPTION: ${BOT_DESCRIPTION:-2025年10月VRC同期会向けに作られたロールパネルBot}
      BOT_DEVELOPER_ID: ${BOT_DEVELOPER_ID:-1340270150217236501}
      BOT_GITHUB_URL: ${BOT_GITHUB_URL:-https://github.com/Aqua-218/RolePanel-Bot}
    ports:
      - "8080:8080"
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: role_panel
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: role_panel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U role_panel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
